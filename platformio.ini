[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1


  ; Waveshare ESP32-S3-ETH onboard W5500 (official board pinout)
  -D ESP_ETH_W5500=1
  -D ESP_ETH_SCK=13
  -D ESP_ETH_MISO=12
  -D ESP_ETH_MOSI=11
  -D ESP_ETH_CS=14
  -D ESP_ETH_IRQ=10
  -D ESP_ETH_RST=9

; Build only: never selected by flash.sh default run. MQTT still disabled until configured.
[env:esp32-s3-eth-mqtt-lab]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_MQTT_EXPERIMENT=1

; Offline text explanation experiment; does not enable Ethernet MQTT.
[env:esp32-s3-log-ai-lab]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_LOG_AI_EXPERIMENT=1
