[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<main.cpp>
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
lib_deps =
  https://github.com/ewpa/LibSSH-ESP32.git#343fce1c5d1d0e3d629807dece6ae1b68ef1d322
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
build_flags =
  -D BOARD_HAS_PSRAM
  -D ESP_STANDALONE=1
  -D ESP_LOG_AI_ENABLED=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1


  ; Waveshare ESP32-S3-ETH onboard W5500 (official board pinout)
  -D ESP_ETH_W5500=1
  -D ESP_ETH_SCK=13
  -D ESP_ETH_MISO=12
  -D ESP_ETH_MOSI=11
  -D ESP_ETH_CS=14
  -D ESP_ETH_IRQ=10
  -D ESP_ETH_RST=9

; Compatibility alias for old test scripts; optional MQTT is included by default.
[env:esp32-s3-eth-mqtt-lab]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}

; Compatibility alias: the default firmware already includes offline analysis.
[env:esp32-s3-log-ai-lab]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_LOG_AI_ENABLED=1

; Archived host-gateway protocol for development tests only, never the default.
[env:esp32-s3-usb-lab]
extends = env:esp32-s3-devkitc-1
build_src_filter = +<legacy/main.cpp>
build_unflags = -D ESP_STANDALONE=1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_STANDALONE=0

; Explicit one-time provisioning for this site's requested Ethernet and SSH profile.
; Does not erase MQTT, history or unrelated NVS; later saved settings take priority.
[env:esp32-s3-site-setup]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_SITE_DEFAULTS_ONCE=20261102

; GPIO17 TX / GPIO18 RX -> 3.3V MAX3232 -> H3C RS232 Console.
[env:esp32-s3-console-uart]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_SWITCH_CHANNEL=1

; Transparent TCP serial server at 192.168.10.3:4001, configured for 9600 8N1.
[env:esp32-s3-console-tcp]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_SWITCH_CHANNEL=2

; Ethernet SSH primary + independent UART1/MAX3232 Console fallback.
[env:esp32-s3-ssh-console]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_SWITCH_CHANNEL=3

; Physical acceptance without BDI switch writes; simulation tests still use full policy.
[env:esp32-s3-readonly-acceptance]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_BDI_READ_ONLY=1

; Explicitly authorized one-shot exercise; only GE1/0/2 and GE1/0/3, ADM baseline.
[env:esp32-s3-port23-exercise]
extends = env:esp32-s3-readonly-acceptance
build_flags =
  ${env:esp32-s3-readonly-acceptance.build_flags}
  -D ESP_PORT_EXERCISE=1

; Operator acceptance goal deliberated by EmbeddedBDI, one-shot ports 2/3 only.
[env:esp32-s3-bdi-port23-exercise]
extends = env:esp32-s3-port23-exercise
build_flags =
  ${env:esp32-s3-port23-exercise.build_flags}
  -D ESP_PORT_EXERCISE_BDI=1

; Real broadcast counters, GE2 only, PVID4090 required; no timed restore.
[env:esp32-s3-storm2-acceptance]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_STORM_ACCEPTANCE=1

; Explicit user command: only shutdown GE2, never enable or touch GE3.
[env:esp32-s3-port2-down]
extends = env:esp32-s3-port23-exercise
build_flags =
  ${env:esp32-s3-port23-exercise.build_flags}
  -D ESP_PORT_SHUTDOWN_ONLY=1

; Locate and isolate confirmed loops on authorized business Access ports; protect GE1.
[env:esp32-s3-loop-auto]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ESP_LOOP_AUTO=1
