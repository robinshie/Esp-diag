<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 · 实时控制台</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10151e; color: #e4eaf2; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 20px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0; color: #a5b4c8; }
    a { color: #8fc9ff; }
    button { padding: 8px 16px; background: #26354a; color: white; border: 1px solid #405069; border-radius: 6px; cursor: pointer; }
    #connection { color: #ffcf75; margin-right: 16px; }
    main { display: grid; grid-template-columns: 1fr; gap: 18px; }
    section { min-width: 0; background: #171f2c; border: 1px solid #354155; border-radius: 10px; overflow: hidden; }
    .heading { padding: 18px; min-height: 146px; border-bottom: 1px solid #354155; }
    h2 { margin: 0 0 10px; font-size: 20px; }
    .state { color: #ffcf75; font-size: 14px; margin-left: 12px; }
    .stats { line-height: 1.9; color: #b4c4d9; font-family: ui-monospace, monospace; font-size: 13px; }
    .logs { height: calc(100vh - 285px); min-height: 300px; overflow: auto; padding: 12px 18px; font: 12px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .line { white-space: pre-wrap; overflow-wrap: anywhere; padding: 3px 0; border-bottom: 1px solid #202b3b; }
    .line summary { cursor: pointer; } .line pre { margin: 8px 0; white-space: pre-wrap; font: inherit; color: #a5b4c8; }
    .line.warn { color: #ffcf75; } .line.fault { color: #ffa5a5; } .line.ok { color: #9de1ba; }
    .time { color: #8da1bb; margin-right: 10px; }
    footer { color: #8da1bb; margin-top: 14px; font-size: 13px; }
    @media(max-width: 850px) { main { grid-template-columns: 1fr; } .logs { height: 40vh; } header { align-items: start; } }
  </style>
</head>
<body>
  <header>
    <div><h1>ESP32 · 实时控制台</h1><p>ESP32 运行状态、BDI 监测结果与处理日志</p></div>
    <div><span id="connection">MQTT 连接中</span><button id="pause">暂停滚动</button></div>
  </header>
  <main>
    <section>
      <div class="heading"><h2><span id="espName">ESP32</span> <span id="espState" class="state">等待串口状态</span></h2>
        <div class="stats">传输 <span id="serialLabel">USB</span> · 实际硬件输出</div>
        <div id="espStats" class="stats">等待设备上报运行时间、堆内存和推理状态…</div>
        <div id="observations" class="stats">等待 ESP32 上报监测结果…</div>
        <div id="espLast" class="stats">尚未收到日志</div>
      </div>
      <div id="espLogs" class="logs" role="log" aria-label="ESP32 实时日志"></div>
    </section>
  </main>
  <footer><span id="archiveState">正在读取当前连接数据…</span> · 每次打包上报显示一条，展开可查看真实 ESP32 USB 原文与网关诊断。<a href="/history.html">历史查询</a> · <a href="/">设备仪表盘</a></footer>
  <script type="module" src="/src/console.js"></script>
</body>
</html>
